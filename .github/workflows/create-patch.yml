
name: create patch

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-oscam-patch
  cancel-in-progress: false

jobs:
  create-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # OSCam-Emu Repository auschecken
      # ============================================================

      - name: Checkout OSCam-Emu master
        uses: actions/checkout@v4
        with:
          repository: speedy005/Oscam-emu
          ref: master
          fetch-depth: 0
          path: source

      # ============================================================
      # Konfiguration normalisieren
      # ============================================================

      - name: Normalize config.sh line endings
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f source/config.sh ]; then
            echo "FEHLER: config.sh wurde nicht gefunden."
            exit 1
          fi

          sed -i 's/\r$//' source/config.sh

          echo "config.sh: LF-Zeilenenden gesetzt."

      # ============================================================
      # Patch-Repository auschecken
      # ============================================================

      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          repository: speedy005/oscam-emu-patch
          token: ${{ secrets.ACTIONS_TOKEN }}
          ref: master
          path: emu
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # Gemeinsame Repository-Sicherheitsprüfung
      # ============================================================

      - name: Verify patch repository
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_REMOTE="https://github.com/speedy005/oscam-emu-patch"
          ACTUAL_REMOTE=$(git -C emu remote get-url origin)

          normalize_url() {
            local url="${1%/}"
            url="${url%.git}"
            printf '%s' "${url,,}"
          }

          EXPECTED_NORMALIZED=$(normalize_url "$EXPECTED_REMOTE")
          ACTUAL_NORMALIZED=$(normalize_url "$ACTUAL_REMOTE")

          echo "=========================================="
          echo "REPOSITORY-SICHERHEITSPRÜFUNG"
          echo "=========================================="

          echo "Erwartet:    $EXPECTED_REMOTE"
          echo "Tatsächlich: $ACTUAL_REMOTE"

          if [ "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]; then
            echo "FEHLER: Falsches Patch-Repository!"
            exit 1
          fi

          echo "OK: Ausschließlich oscam-emu-patch erlaubt."

      # ============================================================
      # Neueste echte Upstream-Quellcode-Basis ermitteln
      # ============================================================

      - name: Find newest upstream base
        id: upstream
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          export GIT_TERMINAL_PROMPT=0

          STREAMBOARD="https://git.streamboard.tv/common/oscam.git"
          MIRROR="https://github.com/speedy005/oscam-git.git"

          STREAM_OK=0
          MIRROR_OK=0

          echo "Prüfe Streamboard..."

          if timeout 20s git fetch --no-tags "$STREAMBOARD" HEAD:refs/remotes/streamboard/HEAD; then
            STREAM_OK=1
            echo "Streamboard erreichbar."
          else
            echo "Streamboard nicht erreichbar oder Zeitüberschreitung."
          fi

          echo "Prüfe GitHub-Mirror..."

          if timeout 60s git fetch --no-tags "$MIRROR" HEAD:refs/remotes/mirror/HEAD; then
            MIRROR_OK=1
            echo "GitHub-Mirror erreichbar."
          else
            echo "GitHub-Mirror nicht erreichbar oder Zeitüberschreitung."
          fi

          if [ "$STREAM_OK" -eq 0 ] && [ "$MIRROR_OK" -eq 0 ]; then
            echo "FEHLER: Keine der beiden Quellen ist erreichbar."
            exit 1

          elif [ "$STREAM_OK" -eq 1 ] && [ "$MIRROR_OK" -eq 0 ]; then
            BASE="refs/remotes/streamboard/HEAD"
            BASE_URL="$STREAMBOARD"

          elif [ "$STREAM_OK" -eq 0 ] && [ "$MIRROR_OK" -eq 1 ]; then
            BASE="refs/remotes/mirror/HEAD"
            BASE_URL="$MIRROR"

          else
            STREAM_COMMIT=$(git rev-parse refs/remotes/streamboard/HEAD)
            MIRROR_COMMIT=$(git rev-parse refs/remotes/mirror/HEAD)

            if [ "$STREAM_COMMIT" = "$MIRROR_COMMIT" ]; then
              BASE="refs/remotes/streamboard/HEAD"
              BASE_URL="$STREAMBOARD"

            elif git merge-base --is-ancestor "$STREAM_COMMIT" "$MIRROR_COMMIT"; then
              BASE="refs/remotes/mirror/HEAD"
              BASE_URL="$MIRROR"

            elif git merge-base --is-ancestor "$MIRROR_COMMIT" "$STREAM_COMMIT"; then
              BASE="refs/remotes/streamboard/HEAD"
              BASE_URL="$STREAMBOARD"

            else
              echo "FEHLER: Unterschiedliche Entwicklungsstände."
              echo "Streamboard: $STREAM_COMMIT"
              echo "GitHub:      $MIRROR_COMMIT"
              exit 1
            fi
          fi

          BASE_CANDIDATE=$(git rev-parse "$BASE")

          echo "Ermittelter Remote-HEAD: $BASE_CANDIDATE"
          echo "Prüfe Commit-Historie..."

          SOURCE_COMMIT=""

          while IFS= read -r CANDIDATE; do

            if git cat-file -e "$CANDIDATE:module-webif.c" 2>/dev/null &&
               git cat-file -e "$CANDIDATE:globals.h" 2>/dev/null; then

              SOURCE_COMMIT="$CANDIDATE"
              break
            fi

            echo "Überspringe künstlichen Patch-Commit: $CANDIDATE"

          done < <(git rev-list --first-parent "$BASE_CANDIDATE")

          if [ -z "$SOURCE_COMMIT" ]; then
            echo "FEHLER: Kein echter OSCam-Quellcode-Commit gefunden."
            exit 1
          fi

          BASE_COMMIT="$SOURCE_COMMIT"

          echo "Verwendete echte Quellcode-Basis: $BASE_COMMIT"

          echo "base=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Patch erstellen
      # ============================================================

      - name: Create patch
        shell: bash
        working-directory: source
        env:
          BASE_COMMIT: ${{ steps.upstream.outputs.base }}
          BASE_URL: ${{ steps.upstream.outputs.base_url }}
        run: |
          set -euo pipefail

          TARGET_COMMIT=$(git rev-parse HEAD)
          TARGET_BRANCH="master"

          EMU_URL="https://github.com/speedy005/Oscam-emu.git"

          VERSION=$(bash ./config.sh --oscam-version)

          PATCH_DATE=$(date '+%Y-%m-%d')
          MODIFIED_DATE=$(date '+%d/%m/%Y')

          echo "=========================================="
          echo "PATCH-DIAGNOSE"
          echo "=========================================="

          echo "Basis:"
          git log -1 --format='%H %s' "$BASE_COMMIT"

          echo "Ziel:"
          git log -1 --format='%H %s' "$TARGET_COMMIT"

          echo "=========================================="
          echo "Änderungen ohne CR-Zeilenendunterschiede"
          echo "=========================================="

          git diff --ignore-cr-at-eol --stat \
            "$BASE_COMMIT" "$TARGET_COMMIT" -- \
            . \
            ':(exclude).github/**' \
            ':(exclude).gitlab/**'

          git cat-file -e "$BASE_COMMIT^{commit}"
          git cat-file -e "$TARGET_COMMIT^{commit}"

          git diff --ignore-cr-at-eol --binary \
            "$BASE_COMMIT" "$TARGET_COMMIT" -- \
            . \
            ':(exclude).github/**' \
            ':(exclude).gitlab/**' \
            > /tmp/oscam-emu.patch

          {
            printf 'patch version: %s (%s)\n' \
              "$VERSION" "${BASE_COMMIT:0:8}"

            printf 'patch date: %s\n' "$PATCH_DATE"
            printf 'patch modified by speedy005 (%s)\n' "$MODIFIED_DATE"
            printf 'patch base commit: %s\n' "$BASE_COMMIT"
            printf 'patch target commit: %s\n' "$TARGET_COMMIT"
            printf 'patch streamboard url: %s\n' "$BASE_URL"
            printf 'patch emu repository url: %s\n' "$EMU_URL"
            printf 'patch emu branch: %s\n' "$TARGET_BRANCH"
            printf '%s\n' '---'

            cat /tmp/oscam-emu.patch

          } > ../emu/oscam-emu.patch

          echo "=========================================="
          echo "PATCH ERSTELLT"
          echo "=========================================="

          echo "Basis:   $BASE_COMMIT"
          echo "Ziel:    $TARGET_COMMIT"
          echo "Version: $VERSION"

          wc -c ../emu/oscam-emu.patch
          du -h ../emu/oscam-emu.patch

      # ============================================================
      # Patch-Zeilenenden normalisieren
      # ============================================================

      - name: Normalize patch line endings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          patch_file = Path("emu/oscam-emu.patch")

          if not patch_file.is_file():
              raise SystemExit("FEHLER: Patch nicht gefunden.")

          data = patch_file.read_bytes()

          data = data.replace(b"\r\n", b"\n")
          data = data.replace(b"\r", b"\n")

          patch_file.write_bytes(data)

          crlf = data.count(b"\r\n")
          lf = data.count(b"\n") - crlf
          cr = data.count(b"\r") - crlf

          print("CRLF:", crlf)
          print("LF:", lf)
          print("CR:", cr)
          print("Dateigröße:", len(data), "Bytes")

          if crlf != 0 or cr != 0:
              raise SystemExit("FEHLER: Patch enthält CR-Zeichen.")

          print("ERFOLG: Ausschließlich LF-Zeilenenden.")
          PY

      # ============================================================
      # Patch committen und übertragen
      # ============================================================

      - name: Commit patch
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          set -euo pipefail

          EXPECTED_REMOTE="https://github.com/speedy005/oscam-emu-patch"

          GENERATED_PATCH="/tmp/oscam-emu.patch.generated"

          cp emu/oscam-emu.patch "$GENERATED_PATCH"

          cd emu

          normalize_url() {
            local url="${1%/}"
            url="${url%.git}"
            printf '%s' "${url,,}"
          }

          verify_remote() {
            local actual
            actual=$(git remote get-url origin)

            echo "Push-Ziel: $actual"

            if [ "$(normalize_url "$actual")" != \
                 "$(normalize_url "$EXPECTED_REMOTE")" ]; then

              echo "FEHLER: Falsches Push-Ziel!"
              exit 1
            fi

            echo "OK: Push-Ziel verifiziert."
          }

          echo "=========================================="
          echo "LETZTE PUSH-ZIEL-KONTROLLE"
          echo "=========================================="

          verify_remote

          git config user.name "oscam-emu-bot"
          git config user.email "187860193+oscam-emu-bot@users.noreply.github.com"

          for attempt in 1 2 3; do

            echo "=========================================="
            echo "Push-Versuch $attempt von 3"
            echo "=========================================="

            verify_remote

            git fetch origin master

            git reset --hard origin/master

            verify_remote

            cp "$GENERATED_PATCH" oscam-emu.patch

            git add oscam-emu.patch

            if git diff --cached --quiet; then
              echo "Patch unverändert – kein Commit erforderlich."
              exit 0
            fi

            VERSION=$(bash ../source/config.sh --oscam-version)

            git commit -m "Sync patch with $VERSION"

            verify_remote

            if git push origin HEAD:master; then
              echo "Patch erfolgreich übertragen."
              exit 0
            fi

            echo "Push fehlgeschlagen. Neuer Versuch."

            sleep 2

          done

          echo "FEHLER: Patch konnte nach 3 Versuchen nicht übertragen werden."
          exit 1
